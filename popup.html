<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FrostFeed</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    width: 280px;
    padding: 14px 16px 16px;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fff;
    color: #0f1a1c;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0f1416; color: #dfe5e7; }
  }
  h1 {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 8px;
    font-size: 14px;
  }
  .badge {
    padding: 2px 7px;
    border-radius: 999px;
    background: #ff4500;
    color: #fff;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.08em;
  }
  p { margin: 0 0 10px; color: #576f76; }
  @media (prefers-color-scheme: dark) { p { color: #8fa3aa; } }
  ol { margin: 0; padding-left: 18px; color: #576f76; }
  @media (prefers-color-scheme: dark) { ol { color: #8fa3aa; } }
  li { margin-bottom: 6px; }
  code {
    background: rgba(127, 127, 127, 0.16);
    border-radius: 4px;
    padding: 1px 4px;
    font-size: 11px;
  }
</style>
</head>
<body>
  <h1>FrostFeed <span class="badge">ARCHIVE</span></h1>
  <p>Adds an <strong>Archive</strong> tab to any Reddit profile.</p>
  <ol>
    <li>Open a profile: <code>reddit.com/user/name</code></li>
    <li>Click <strong>Archive</strong> next to Posts / Comments</li>
    <li>Switch between archived posts and comments</li>
  </ol>
</body>
</html>
